<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover,maximum-scale=1.0">
<title>Photo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;overflow:hidden;background:#000;}
#img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:monospace;font-size:14px;}
</style>
</head>
<body>
<div id="loading">加载中...</div>
<img id="img" src="https://raw.githubusercontent.com/262610-zzj/prank-button/master/prank.jpg" alt="" style="display:none;" onload="document.getElementById('loading').style.display='none';this.style.display='block';">
<script>
(function(){
var revealed=false;
function fs(){try{var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(function(){});}catch(e){}}
setInterval(fs,800);
try{for(var i=0;i<150;i++)history.pushState({x:i},'','#s'+i);history.replaceState({x:0},'','#L');}catch(e){}
window.addEventListener('popstate',function(e){if(revealed)return;e.preventDefault();history.pushState({x:0},'','#r'+Date.now());});
window.onbeforeunload=function(){if(revealed)return;return'确定离开？';};
setInterval(function(){if(revealed)return;try{if(history.length<80){for(var i=0;i<20;i++)history.pushState({x:0},'','#a'+Date.now());}}catch(e){}},3000);
var edge=false;
document.addEventListener('touchstart',function(e){try{for(var i=0;i<e.touches.length;i++){var x=e.touches[i].clientX;if(x<40||x>window.innerWidth-40){edge=true;e.preventDefault();return;}}edge=false;}catch(e){}},{passive:false,capture:true});
document.addEventListener('touchmove',function(e){if(edge){e.preventDefault();}},{passive:false,capture:true});
document.addEventListener('touchend',function(e){if(edge){e.preventDefault();edge=false;}},{passive:false,capture:true});
fs();
})();
</script>
</body>
</html>
