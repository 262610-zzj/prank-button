<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: #0a0a0a; color: #0f0;
    font-family: "Courier New", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
    font-size: 13px; line-height: 1.6;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #terminal {
    height: 100%; overflow-y: auto; padding: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .line {
    white-space: pre-wrap; word-break: break-all;
    min-height: 1.4em;
  }
  .line.green { color: #0f0; }
  .line.dim { color: #0a0; }
  .line.yellow { color: #ff0; }
  .line.red { color: #f33; }
  .line.cyan { color: #0ff; }
  .line.gray { color: #555; }

  .prompt { color: #0f0; display: inline; }
  .cursor {
    display: inline-block; width: 8px; height: 14px;
    background: #0f0; animation: blink 0.8s step-end infinite;
    vertical-align: middle; margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #input-area {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0a0a0a; padding: 8px 12px 16px;
    border-top: 1px solid #1a1a1a;
    display: flex; align-items: center; gap: 6px;
    z-index: 10;
  }
  #input-area .ps1 { color: #0f0; font-size: 13px; white-space: nowrap; }
  #cmd-input {
    flex: 1; background: transparent; border: none; color: #0f0;
    font-family: inherit; font-size: 13px; outline: none;
    caret-color: #0f0;
  }
  #cmd-input::placeholder { color: #333; }

  /* 覆盖层 */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .overlay.hidden { display: none; }

  .overlay-box {
    background: #111; border: 1px solid #333; border-radius: 4px;
    padding: 24px; max-width: 300px; text-align: center;
  }
  .overlay-box .title { color: #f33; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .overlay-box .msg { color: #888; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  .overlay-box .btn {
    display: block; width: 100%; padding: 10px; margin-top: 8px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    border: 1px solid #333; border-radius: 4px;
    cursor: pointer; background: #111; color: #0f0;
  }
  .overlay-box .btn.danger { color: #f33; border-color: #f33; }
  .overlay-box .btn:hover, .overlay-box .btn:active { background: #1a1a1a; }

  /* 进度条 */
  #progress-wrap {
    display: none; position: fixed; bottom: 46px; left: 12px; right: 12px;
    z-index: 5;
  }
  #progress-wrap .label { color: #555; font-size: 11px; margin-bottom: 2px; font-family: inherit; }
  #progress-bar {
    height: 3px; background: #1a1a1a; border-radius: 1px;
    overflow: hidden;
  }
  #progress-bar .fill {
    height: 100%; background: #0f0; width: 0%;
    transition: width 0.3s;
    border-radius: 1px;
  }

  /* 彩纸 */
  .confetti {
    position: fixed; width: 8px; height: 8px;
    z-index: 200; pointer-events: none;
  }
</style>
</head>
<body>

<div id="terminal"></div>

<div id="progress-wrap">
  <div class="label">[SCANNING]</div>
  <div id="progress-bar"><div class="fill"></div></div>
</div>

<div id="input-area">
  <span class="ps1">$</span>
  <input id="cmd-input" placeholder="输入命令..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<div id="exit-overlay" class="overlay hidden">
  <div class="overlay-box">
    <div class="title" id="exit-title">⚠ WARNING</div>
    <div class="msg" id="exit-msg">扫描尚未完成，退出可能导致数据损坏。</div>
    <button class="btn" id="stay-btn">[ stay ] 继续扫描</button>
    <button class="btn danger" id="leave-btn">[ exit ] 强制退出</button>
  </div>
</div>

<script>
// ============ 终端引擎 ============
const term = document.getElementById('terminal');
const input = document.getElementById('cmd-input');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.querySelector('#progress-bar .fill');
const exitOverlay = document.getElementById('exit-overlay');
const exitTitle = document.getElementById('exit-title');
const exitMsg = document.getElementById('exit-msg');
const stayBtn = document.getElementById('stay-btn');
const leaveBtn = document.getElementById('leave-btn');

let exitAttempts = 0;
let scanPhase = 0;
let scanAttempts = 0;
let revealed = false;
let locked = false;
const MAX_SCANS = 4;

// ============ 输出到终端 ============
function print(text, cls, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line' + (cls ? ' ' + cls : '');
      div.textContent = text;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
      resolve();
    }, delay);
  });
}

async function printLines(lines, startDelay) {
  let d = startDelay || 0;
  for (const l of lines) {
    await print(l.text, l.cls, d);
    d += l.delay || 200;
  }
  return d;
}

// ============ 返回键拦截（终极版） ============
function lockHistory() {
  locked = true;
  history.replaceState({ locked: true }, '', '#locked');
  for (let i = 0; i < 200; i++) {
    history.pushState({ locked: true, step: i }, '', '#s' + i);
  }
  history.replaceState({ locked: true }, '', '#locked');
  for (let i = 0; i < 80; i++) {
    history.pushState({ locked: true, step: 'x' + i }, '', '#x' + i);
  }
}

lockHistory();

window.addEventListener('popstate', function(e) {
  if (revealed) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  history.pushState({ locked: true }, '', '#r' + Date.now());
  showExitDialog();
  vib([100, 40, 100]);
  return false;
});

window.onbeforeunload = function() {
  if (revealed) return;
  return '安全扫描未完成，确定离开？';
};

window.addEventListener('pagehide', function(e) {
  if (revealed) return;
  e.preventDefault();
  return '';
}, { capture: true });

document.addEventListener('visibilitychange', function() {
  if (revealed) return;
  if (document.hidden) {
    for (let i = 0; i < 15; i++) {
      history.pushState({ locked: true }, '', '#v' + Date.now());
    }
  }
}, { capture: true });

setInterval(() => {
  if (revealed) return;
  if (history.length < 120) {
    for (let i = 0; i < 40; i++) {
      history.pushState({ locked: true }, '', '#a' + Date.now());
    }
  }
}, 2500);

// ============ 退出弹窗 ============
function showExitDialog() {
  exitAttempts++;
  exitOverlay.classList.remove('hidden');

  if (exitAttempts >= 5) {
    // 放行
    exitTitle.textContent = '...';
    exitMsg.textContent = '好吧，你赢了。';
    leaveBtn.textContent = '[ exit ] 退出';
    revealed = true;
    return;
  }

  const msgs = [
    '扫描尚未完成，退出可能导致数据损坏。',
    '警告：检测到活跃的后门连接，请不要退出！',
    '危险：强制退出将触发系统保护机制，可能导致数据永久丢失！',
    '最后一次警告：你的个人信息正在被窃取，退出将无法恢复！',
  ];
  exitMsg.textContent = msgs[Math.min(exitAttempts - 1, 3)];
  exitTitle.textContent = exitAttempts < 3 ? '⚠ WARNING' : '🚫 CRITICAL';
  leaveBtn.textContent = exitAttempts < 4 ? `[ exit ] 强制退出 (${exitAttempts}/5)` : '[ exit ] 我不管了！';
}

stayBtn.addEventListener('click', function() {
  exitOverlay.classList.add('hidden');
  history.pushState({ locked: true }, '', '#' + Date.now());
});

leaveBtn.addEventListener('click', function() {
  if (revealed) {
    exitOverlay.classList.add('hidden');
    for (let i = 0; i < 100; i++) history.back();
    setTimeout(() => { window.close(); }, 100);
    return;
  }
  exitOverlay.classList.add('hidden');
  showExitDialog();
});

// ============ 全屏 ============
function goFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e) {}
}
document.addEventListener('click', goFullscreen, { once: true });
document.addEventListener('touchstart', goFullscreen, { once: true });

// ============ 震动 ============
function vib(p) { if (navigator.vibrate) navigator.vibrate(p); }

// ============ 初始化终端 ============
async function initTerminal() {
  await printLines([
    { text: '>>> SYSTEM INITIALIZATION v3.2.1 <<<', cls: 'cyan', delay: 300 },
    { text: 'kernel: Linux 5.15.0-android', cls: 'dim', delay: 200 },
    { text: 'arch: aarch64', cls: 'dim', delay: 150 },
    { text: 'shell: bash 5.2', cls: 'dim', delay: 150 },
    { text: '', cls: 'dim', delay: 100 },
    { text: '[INFO] 正在连接安全服务中心...', cls: 'green', delay: 400 },
    { text: '[INFO] 已建立加密通道 (TLS 1.3)', cls: 'green', delay: 300 },
    { text: '[INFO] 加载病毒特征库: 2,847,391 条', cls: 'green', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '╔══════════════════════════════════════╗', cls: 'yellow', delay: 150 },
    { text: '║  ⚠ SECURITY ALERT - 系统安全警报    ║', cls: 'yellow', delay: 150 },
    { text: '╚══════════════════════════════════════╝', cls: 'yellow', delay: 150 },
    { text: '', cls: 'dim', delay: 100 },
    { text: '检测到以下安全威胁:', cls: 'red', delay: 300 },
    { text: '  [HIGH]   恶意软件感染 (2个)', cls: 'red', delay: 200 },
    { text: '  [HIGH]   隐私数据泄露风险', cls: 'red', delay: 200 },
    { text: '  [MEDIUM] 网络流量异常', cls: 'yellow', delay: 200 },
    { text: '  [MEDIUM] 未授权后台进程', cls: 'yellow', delay: 200 },
    { text: '', cls: 'dim', delay: 150 },
    { text: '输入 scan 开始深度扫描，或输入 exit 退出', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ]);
}

// ============ 扫描阶段 ============
async function runScan() {
  scanAttempts++;
  const scanLabel = document.querySelector('#progress-wrap .label');
  const pbar = document.querySelector('#progress-bar');

  if (scanAttempts >= MAX_SCANS) {
    await printLines([
      { text: '', cls: 'dim', delay: 200 },
      { text: '╔══════════════════════════════════════╗', cls: 'cyan', delay: 150 },
      { text: '║  SCAN COMPLETE - 扫描完成           ║', cls: 'cyan', delay: 150 },
      { text: '╚══════════════════════════════════════╝', cls: 'cyan', delay: 150 },
      { text: '', cls: 'dim', delay: 200 },
      { text: '>>> 扫描结果:', cls: 'yellow', delay: 300 },
      { text: '    威胁总数:  47', cls: 'red', delay: 200 },
      { text: '    高危:      31 (系统级)', cls: 'red', delay: 200 },
      { text: '    中危:      12', cls: 'yellow', delay: 200 },
      { text: '    低危:      4', cls: 'dim', delay: 200 },
      { text: '', cls: 'dim', delay: 150 },
      { text: '    Trojan.Android.FakeApp     [HIGH]', cls: 'red', delay: 200 },
      { text: '    Spyware.KeyLogger.v3       [HIGH]', cls: 'red', delay: 200 },
      { text: '    Phishing.Payload.v7        [HIGH]', cls: 'red', delay: 200 },
      { text: '    Adware.Popup.Bomb          [MEDIUM]', cls: 'yellow', delay: 200 },
      { text: '    Exploit.WebView.Leak       [MEDIUM]', cls: 'yellow', delay: 200 },
      { text: '    Ransomware.Locker.v2       [HIGH]', cls: 'red', delay: 200 },
      { text: '', cls: 'dim', delay: 150 },
      { text: '输入 clean 开始清理，或输入 exit 退出', cls: 'dim', delay: 300 },
      { text: '', cls: 'dim', delay: 100 },
    ]);
    scanPhase = 2;
    progressWrap.style.display = 'none';
    vib([300, 100, 300, 100, 800]);
    return;
  }

  progressWrap.style.display = 'block';
  scanLabel.textContent = '[SCANNING] Depth Level ' + scanAttempts;

  // 进度条动画
  let p = 0;
  const progressInterval = setInterval(() => {
    p += Math.random() * 3;
    if (p > 95) p = 95;
    progressFill.style.width = Math.min(p, 95) + '%';
  }, 200);

  const scanLines = [
    { text: '>>> 开始扫描... (Level ' + scanAttempts + ')', cls: 'cyan', delay: 300 },
    { text: '[OK] 检查 /system', cls: 'green', delay: 400 },
    { text: '[OK] 检查 /data', cls: 'green', delay: 350 },
    { text: '[OK] 检查 /sdcard', cls: 'green', delay: 300 },
    { text: '[*] 扫描用户应用...', cls: 'dim', delay: 500 },
    { text: '[WARN] 可疑进程: com.android.fakeapp (PID: 12847)', cls: 'yellow', delay: 600 },
    { text: '[WARN] 异常权限: android.permission.READ_CONTACTS', cls: 'yellow', delay: 500 },
    { text: '[WARN] 异常权限: android.permission.RECORD_AUDIO', cls: 'yellow', delay: 400 },
    { text: '[*] 扫描网络连接...', cls: 'dim', delay: 500 },
    { text: '[WARN] 可疑出站连接: 185.244.xxx.xxx:443', cls: 'yellow', delay: 500 },
    { text: '[WARN] 数据外传: ' + (Math.random() * 5 + 1).toFixed(1) + 'MB', cls: 'yellow', delay: 400 },
    { text: '[*] 扫描存储...', cls: 'dim', delay: 400 },
    { text: '[WARN] 隐藏文件: /sdcard/.cache/.trojan.dat', cls: 'yellow', delay: 500 },
    { text: '[ALERT] 检测到键盘记录器!', cls: 'red', delay: 700 },
    { text: '[ALERT] 检测到屏幕截图窃取!', cls: 'red', delay: 600 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '>>> 第 ' + scanAttempts + ' 次扫描完成，发现新威胁', cls: 'yellow', delay: 400 },
    { text: '输入 scan 继续深度扫描，或输入 exit 退出', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ];

  await printLines(scanLines);

  clearInterval(progressInterval);
  progressFill.style.width = '100%';
  setTimeout(() => { progressFill.style.width = '0%'; progressWrap.style.display = 'none'; }, 500);
  vib([150, 50, 150]);
}

// ============ 清理阶段 ============
async function runClean() {
  await printLines([
    { text: '>>> 启动清理程序...', cls: 'cyan', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '[..] 清除 Trojan.Android.FakeApp...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 病毒已变异', cls: 'red', delay: 400 },
    { text: '[..] 清除 Spyware.KeyLogger.v3...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 权限不足', cls: 'red', delay: 400 },
    { text: '[..] 清除 Phishing.Payload.v7...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 进程保护', cls: 'red', delay: 400 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '╔══════════════════════════════════════╗', cls: 'red', delay: 150 },
    { text: '║  !! 清理失败 - 需要管理员权限 !!   ║', cls: 'red', delay: 150 },
    { text: '╚══════════════════════════════════════╝', cls: 'red', delay: 150 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '输入 sudo clean 获取管理员权限清理', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ]);
  vib([200, 100, 200, 100, 300]);
}

// ============ 揭晓 ============
async function revealTruth() {
  revealed = true;
  progressWrap.style.display = 'none';
  input.disabled = true;

  await printLines([
    { text: '', cls: 'dim', delay: 300 },
    { text: '>>> 正在获取管理员权限...', cls: 'cyan', delay: 300 },
    { text: '[OK] 权限提升成功 (root)', cls: 'green', delay: 300 },
    { text: '', cls: 'dim', delay: 500 },
    { text: '╔══════════════════════════════════════╗', cls: 'green', delay: 150 },
    { text: '║                                    ║', cls: 'green', delay: 100 },
    { text: '║     🤡  你 被 骗 了 ！  🤡        ║', cls: 'green', delay: 100 },
    { text: '║                                    ║', cls: 'green', delay: 100 },
    { text: '╚══════════════════════════════════════╝', cls: 'green', delay: 150 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '你的手机根本没有病毒。', cls: 'green', delay: 400 },
    { text: '这一切都是假的。', cls: 'green', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '你被恶搞了 ' + (scanAttempts) + ' 次，', cls: 'yellow', delay: 300 },
    { text: '但你的手机很安全 :)', cls: 'green', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '—— 来自你最好的朋友的恶作剧 😈', cls: 'dim', delay: 500 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '现在可以安全关闭了。', cls: 'gray', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ]);

  // 彩纸
  launchConfetti();
}

function launchConfetti() {
  const colors = ['#0f0','#ff0','#0ff','#f0f','#f33','#0a0','#fff'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.width = (4 + Math.random() * 10) + 'px';
      c.style.height = (4 + Math.random() * 10) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
      document.body.appendChild(c);
      const dur = 1500 + Math.random() * 2500;
      const dx = (Math.random() - 0.5) * 250;
      c.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${window.innerHeight+20}px) rotate(${Math.random()*720}deg)`, opacity: 0.2 }
      ], { duration: dur, easing: 'cubic-bezier(.25,.46,.45,.94)' });
      setTimeout(() => c.remove(), dur);
    }, i * 30);
  }
}

// ============ 命令处理 ============
input.addEventListener('keydown', async function(e) {
  if (e.key !== 'Enter' || revealed) return;
  const cmd = input.value.trim().toLowerCase();
  input.value = '';

  if (!cmd) return;

  // 回显命令
  await print('$ ' + cmd, 'green', 50);

  if (locked) {
    // 正式流程
    switch (cmd) {
      case 'scan':
        if (scanPhase === 0 || scanPhase === 1) {
          await runScan();
          if (scanPhase === 0) scanPhase = 1;
        } else if (scanPhase === 2) {
          await print('>>> 扫描已完成。输入 clean 清理病毒。', 'dim', 200);
        }
        break;
      case 'clean':
        if (scanPhase === 2) {
          await runClean();
          scanPhase = 3;
        } else if (scanPhase < 2) {
          await print('>>> 请先完成扫描。输入 scan', 'dim', 200);
        } else {
          await print('>>> 输入 sudo clean 获取管理员权限', 'dim', 200);
        }
        break;
      case 'sudo clean':
        await revealTruth();
        break;
      case 'exit':
        showExitDialog();
        break;
      case 'help':
        await printLines([
          { text: '可用命令:', cls: 'cyan', delay: 100 },
          { text: '  scan      - 深度安全扫描', cls: 'dim', delay: 100 },
          { text: '  clean     - 清理病毒', cls: 'dim', delay: 100 },
          { text: '  sudo clean - 管理员权限清理', cls: 'dim', delay: 100 },
          { text: '  exit      - 退出', cls: 'dim', delay: 100 },
          { text: '  help      - 显示帮助', cls: 'dim', delay: 100 },
        ]);
        break;
      default:
        await print('bash: ' + cmd.split(' ')[0] + ': command not found', 'red', 100);
        await print('输入 help 查看可用命令', 'dim', 200);
    }
  }
});

// ============ 启动 ============
goFullscreen();
setTimeout(() => {
  initTerminal();
  input.focus();
}, 500);

// 点击终端聚焦输入框
term.addEventListener('click', () => input.focus());
</script>
</body>
</html>
