<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover,maximum-scale=1.0">
<title>Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;width:100%;background:#0a0a0a;color:#0f0;font-family:monospace;font-size:13px;line-height:1.5;}
#term{position:absolute;top:0;left:0;right:0;bottom:48px;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch;}
#bar{position:absolute;bottom:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:6px;padding:10px 12px;background:#0a0a0a;border-top:1px solid #1a1a1a;}
#bar span{color:#0f0;font-size:13px;}
#inp{flex:1;background:transparent;border:none;color:#0f0;font-family:inherit;font-size:13px;outline:none;caret-color:#0f0;}
#inp::placeholder{color:#333;}
.l{white-space:pre-wrap;word-break:break-all;}
.g{color:#0f0;}.d{color:#0c0;}.y{color:#ff0;}.r{color:#f33;}.c{color:#0ff;}.x{color:#555;}
#prog{display:none;position:absolute;bottom:48px;left:12px;right:12px;z-index:5;}
#prog .lb{color:#555;font-size:11px;margin-bottom:2px;}
#prog .pb{height:3px;background:#1a1a1a;border-radius:1px;overflow:hidden;}
#prog .f{height:100%;background:#0f0;width:0;border-radius:1px;}
.ol{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);align-items:center;justify-content:center;flex-direction:column;}
.ol.s{display:flex;}
.bx{background:#111;border:1px solid #333;border-radius:4px;padding:24px;max-width:300px;text-align:center;}
.bx .t{color:#f33;font-size:15px;font-weight:700;margin-bottom:8px;}
.bx .m{color:#888;font-size:13px;line-height:1.6;margin-bottom:16px;}
.bx .b{display:block;width:100%;padding:10px;margin-top:8px;font-size:13px;font-weight:700;font-family:inherit;border:1px solid #333;border-radius:4px;cursor:pointer;background:#111;color:#0f0;}
.bx .b.p{background:#1a3a1a;border-color:#0f0;}
.bx .b.r{color:#f33;border-color:#f33;}
.bx .b:active{background:#1a1a1a;}
</style>
</head>
<body>
<div id="term"><div class="l d">正在加载安全中心...</div></div>
<div id="prog"><div class="lb">[SCANNING]</div><div class="pb"><div class="f"></div></div></div>
<div id="bar"><span>$</span><input id="inp" placeholder="输入命令..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
<div id="perm" class="ol"><div class="bx"><div class="t">🔐 权限请求</div><div class="m">安全中心需要读取应用数据<br>以进行深度扫描。<br><br>是否允许？</div><button class="b p" id="py">[ Y ] 允许（推荐）</button><button class="b r" id="pn">[ N ] 拒绝</button></div></div>
<div id="exit" class="ol"><div class="bx"><div class="t" id="et">⚠ WARNING</div><div class="m" id="em">扫描尚未完成，退出可能导致数据损坏。</div><button class="b" id="sb">[ stay ] 继续扫描</button><button class="b r" id="lb">[ exit ] 强制退出</button></div></div>
<script>
(function(){
var term=document.getElementById('term');
var inp=document.getElementById('inp');
var prog=document.getElementById('prog');
var pfill=document.querySelector('#prog .f');
var perm=document.getElementById('perm');
var exitEl=document.getElementById('exit');
var et=document.getElementById('et');
var em=document.getElementById('em');
var sb=document.getElementById('sb');
var lb=document.getElementById('lb');
var phase=0,mode=null,revealed=false,exitN=0;

function p(t,c,d){return new Promise(function(r){setTimeout(function(){var e=document.createElement('div');e.className='l'+(c?' '+c:'');e.textContent=t;term.appendChild(e);term.scrollTop=term.scrollHeight;r();},d);});}
function pl(lines){var d=0;lines.forEach(function(l){setTimeout(function(){var e=document.createElement('div');e.className='l'+(l.c?' '+l.c:'');e.textContent=l.t;term.appendChild(e);term.scrollTop=term.scrollHeight;},d);d+=l.d||80;});return new Promise(function(r){setTimeout(r,d+100);});}
function v(x){if(navigator.vibrate)navigator.vibrate(x);}

// 全屏
function fs(){try{var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen().catch(function(){});}catch(e){}}
setInterval(fs,800);

// 返回拦截
try{for(var i=0;i<150;i++)history.pushState({x:i},'','#s'+i);history.replaceState({x:0},'','#L');}catch(e){}
window.addEventListener('popstate',function(e){if(revealed)return;e.preventDefault();history.pushState({x:0},'','#r'+Date.now());showExit();v([100,40,100]);});
window.onbeforeunload=function(){if(revealed)return;return'安全扫描未完成，确定离开？';};
setInterval(function(){if(revealed)return;try{if(history.length<80){for(var i=0;i<20;i++)history.pushState({x:0},'','#a'+Date.now());}}catch(e){}},3000);

// 边缘拦截
var edge=false;
document.addEventListener('touchstart',function(e){try{for(var i=0;i<e.touches.length;i++){var x=e.touches[i].clientX;if(x<40||x>window.innerWidth-40){edge=true;e.preventDefault();return;}}edge=false;}catch(e){}},{passive:false,capture:true});
document.addEventListener('touchmove',function(e){if(edge){e.preventDefault();v([20]);}},{passive:false,capture:true});
document.addEventListener('touchend',function(e){if(edge){e.preventDefault();edge=false;}},{passive:false,capture:true});

// 退出弹窗
function showExit(){exitN++;exitEl.classList.add('s');if(exitN>=5){et.textContent='...';em.textContent='好吧，你赢了。';lb.textContent='[ exit ] 退出';revealed=true;return;}var ms=['扫描尚未完成，退出可能导致数据损坏。','警告：检测到活跃的后门连接，请不要退出！','危险：强制退出将触发系统保护机制，可能导致数据永久丢失！','最后一次警告：你的个人信息正在被窃取，退出将无法恢复！'];em.textContent=ms[Math.min(exitN-1,3)];et.textContent=exitN<3?'⚠ WARNING':'🚫 CRITICAL';lb.textContent=exitN<4?'[ exit ] 强制退出 ('+exitN+'/5)':'[ exit ] 我不管了！';}
sb.addEventListener('click',function(){exitEl.classList.remove('s');try{history.pushState({x:0},'','#'+Date.now());}catch(e){}});
lb.addEventListener('click',function(){if(revealed){exitEl.classList.remove('s');try{for(var i=0;i<50;i++)history.back();}catch(e){}setTimeout(function(){window.close();},100);return;}exitEl.classList.remove('s');showExit();});

// 初始化
async function init(){
  term.innerHTML='';
  await pl([
    {t:'>>> SYSTEM INITIALIZATION v3.2.1 <<<',c:'c',d:80},
    {t:'kernel: Linux 5.15.0-android-vivo',c:'d',d:60},
    {t:'arch: aarch64',c:'d',d:50},
    {t:'device: vivo X200s',c:'d',d:50},
    {t:'',c:'d',d:30},
    {t:'[INFO] 正在连接安全服务中心...',c:'g',d:120},
    {t:'[INFO] 已建立加密通道 (TLS 1.3)',c:'g',d:100},
    {t:'[INFO] 加载病毒特征库: 2,847,391 条',c:'g',d:100},
    {t:'',c:'d',d:60},
    {t:'╔══════════════════════════════════════╗',c:'y',d:50},
    {t:'║  ⚠ SECURITY ALERT - 系统安全警报    ║',c:'y',d:50},
    {t:'╚══════════════════════════════════════╝',c:'y',d:50},
    {t:'',c:'d',d:40},
    {t:'检测到以下安全威胁:',c:'r',d:100},
    {t:'  [HIGH]   恶意软件感染 (2个)',c:'r',d:60},
    {t:'  [HIGH]   隐私数据泄露风险',c:'r',d:60},
    {t:'  [MEDIUM] 网络流量异常',c:'y',d:60},
    {t:'  [MEDIUM] 未授权后台进程',c:'y',d:60},
    {t:'',c:'d',d:50},
    {t:'输入 scan 开始扫描',c:'d',d:100},
    {t:'',c:'d',d:40},
  ]);
}

// 权限弹窗
function askPerm(){return new Promise(function(r){perm.classList.add('s');document.getElementById('py').onclick=function(){perm.classList.remove('s');r('deep');};document.getElementById('pn').onclick=function(){perm.classList.remove('s');r('shallow');};});}

// 扫描
async function runScan(){
  mode=await askPerm();
  await p('$ scan','g',50);
  await p('','d',50);
  await p('>>> '+(mode==='deep'?'[DEEP SCAN] 深度扫描模式':'[SHALLOW SCAN] 浅度扫描模式'),'c',80);

  var common=[
    '/system/framework/core.jar','/system/lib64/libandroid_runtime.so',
    '/system/app/WebViewGoogle/WebViewGoogle.apk','/data/system/packages.xml',
    '/data/data/com.android.providers.contacts/databases/contacts2.db',
    '/data/data/com.android.chrome/app_chrome/Default/Cookies',
    '/data/data/com.android.providers.telephony/databases/mmssms.db',
    '/sdcard/Android/data/com.tencent.mm/MicroMsg/Download/',
    '/sdcard/DCIM/Camera/','/sdcard/Pictures/Screenshots/',
    '/sdcard/Download/','/proc/self/maps','/proc/net/tcp',
    '/data/app/com.tencent.mm-xxx/base.apk','/data/app/com.taobao.taobao-xxx/base.apk',
    '/data/app/com.tencent.mobileqq-xxx/base.apk',
  ];
  var deepMore=[
    '/data/data/com.tencent.mm/databases/EnMicroMsg.db',
    '/data/data/com.tencent.mm/shared_prefs/auth_info_key.xml',
    '/data/data/com.tencent.mobileqq/databases/QQ_database',
    '/data/data/com.taobao.taobao/databases/taobao.db',
    '/data/data/com.eg.android.AlipayGphone/shared_prefs/alipay_pref.xml',
    '/data/data/com.sina.weibo/databases/weibo.db',
    '/data/data/com.ss.android.ugc.aweme/shared_prefs/',
    '/data/data/com.xingin.xhs/databases/',
    '/data/data/com.android.email/databases/EmailProvider.db',
    '/data/data/com.google.android.gm/databases/mailstore.db',
    '/sdcard/DCIM/Camera/IMG_20240815_143022.jpg',
    '/sdcard/Pictures/WeiXin/wx_camera_1723698744.jpg',
    '/sdcard/tencent/MicroMsg/weixin/',
    '/data/misc/wifi/wpa_supplicant.conf',
    '/data/system/gesture.key',
    '/data/system/locksettings.db',
    '/proc/self/status','/proc/self/environ',
  ];
  var shallowMore=[
    '/data/data/com.android.browser/databases/browser2.db',
    '/sdcard/Download/','/sdcard/DCIM/Camera/',
    '/sdcard/Pictures/Screenshots/','/data/system/packages.xml',
    '/proc/net/tcp',
  ];

  var files=common.slice();
  if(mode==='deep')files=files.concat(deepMore);else files=files.concat(shallowMore);

  prog.style.display='block';
  prog.querySelector('.lb').textContent=mode==='deep'?'[SCANNING] 深度扫描中...':'[SCANNING] 浅度扫描中...';

  var pp=0;
  var pi=setInterval(function(){pp+=Math.random()*8+4;if(pp>98)pp=98;pfill.style.width=Math.min(pp,98)+'%';},50);

  var delay=0;
  for(var i=0;i<files.length;i+=3){
    delay+=40+Math.random()*60;
    (function(batch){
      setTimeout(function(){
        batch.forEach(function(f){
          var c=Math.random()<0.15?'y':Math.random()<0.05?'r':'d';
          var e=document.createElement('div');e.className='l '+c;
          e.textContent='  [READ] '+f;term.appendChild(e);
        });
        term.scrollTop=term.scrollHeight;
      },delay);
    })(files.slice(i,i+3));
  }

  await new Promise(function(r){setTimeout(r,delay+200);});
  clearInterval(pi);pfill.style.width='100%';
  setTimeout(function(){pfill.style.width='0';prog.style.display='none';},500);

  var deepThreats=[
    {t:'Trojan.Android.FakeApp',c:'r',d:'伪装系统应用，窃取银行密码'},
    {t:'Spyware.KeyLogger.v3',c:'r',d:'记录所有键盘输入'},
    {t:'Phishing.Payload.v7',c:'r',d:'伪造银行页面'},
    {t:'Ransomware.Locker.v2',c:'r',d:'加密用户文件，勒索比特币'},
    {t:'BankBot.Android.v5',c:'r',d:'拦截短信验证码，盗刷银行卡'},
    {t:'Adware.Popup.Bomb',c:'y',d:'弹出大量广告'},
    {t:'Exploit.WebView.Leak',c:'y',d:'利用浏览器漏洞'},
    {t:'Cryptominer.Hidden.v2',c:'y',d:'偷偷挖矿，消耗电量'},
    {t:'Spyware.Camera.Access',c:'y',d:'后台调用摄像头'},
    {t:'InfoStealer.Clipboard',c:'d',d:'监控剪贴板'},
    {t:'Tracker.Location.Log',c:'d',d:'记录GPS位置'},
  ];
  var shallowThreats=[
    {t:'Trojan.Android.FakeApp',c:'r',d:'可疑应用'},
    {t:'Adware.Popup.Bomb',c:'y',d:'弹出广告'},
    {t:'Exploit.WebView.Leak',c:'y',d:'浏览器漏洞'},
    {t:'InfoStealer.Clipboard',c:'d',d:'监控剪贴板'},
  ];

  var threats=mode==='deep'?deepThreats:shallowThreats;
  var total=mode==='deep'?47:12;
  var hi=mode==='deep'?31:3;
  var mi=mode==='deep'?12:5;
  var lo=mode==='deep'?4:4;

  await pl([
    {t:'',c:'d',d:100},
    {t:'╔══════════════════════════════════════╗',c:'c',d:50},
    {t:'║  SCAN COMPLETE - 扫描完成           ║',c:'c',d:50},
    {t:'╚══════════════════════════════════════╝',c:'c',d:50},
    {t:'',c:'d',d:80},
    {t:'>>> 扫描统计:',c:'y',d:100},
    {t:'    扫描文件: '+files.length,c:'d',d:60},
    {t:'    威胁总数: '+total,c:'r',d:60},
    {t:'    高危: '+hi+'  |  中危: '+mi+'  |  低危: '+lo,c:'y',d:60},
    {t:'',c:'d',d:80},
    {t:'>>> 检测到的威胁:',c:'y',d:100},
  ]);

  for(var j=0;j<threats.length;j++){
    await p('    '+threats[j].t+'  ['+(threats[j].c==='r'?'HIGH':threats[j].c==='y'?'MEDIUM':'LOW')+']',threats[j].c,60);
    await p('      '+threats[j].d,'d',40);
  }

  await pl([
    {t:'',c:'d',d:80},
    {t:'输入 clean 开始清理病毒',c:'d',d:100},
    {t:'',c:'d',d:40},
  ]);
  phase=2;v([300,100,300,100,800]);
}

// 清理
async function runClean(){
  var threats=mode==='deep'?[
    'Trojan.Android.FakeApp','Spyware.KeyLogger.v3','Phishing.Payload.v7',
    'Ransomware.Locker.v2','BankBot.Android.v5','Adware.Popup.Bomb',
    'Exploit.WebView.Leak','Cryptominer.Hidden.v2','Spyware.Camera.Access',
  ]:[
    'Trojan.Android.FakeApp','Adware.Popup.Bomb','Exploit.WebView.Leak',
  ];
  await pl([{t:'>>> 启动清理程序...',c:'c',d:100},{t:'',c:'d',d:60}]);
  for(var j=0;j<threats.length;j++){await p('[..] 清除 '+threats[j]+'...','d',80);await p('[FAIL] 清理失败 - 病毒已变异','r',40);v([30]);}
  await pl([
    {t:'',c:'d',d:60},
    {t:'╔══════════════════════════════════════╗',c:'r',d:50},
    {t:'║  !! 清理失败 - 需要管理员权限 !!   ║',c:'r',d:50},
    {t:'╚══════════════════════════════════════╝',c:'r',d:50},
    {t:'',c:'d',d:60},
    {t:'输入 sudo clean 获取管理员权限清理',c:'d',d:100},
    {t:'',c:'d',d:40},
  ]);
  phase=3;v([200,100,200,100,300]);
}

// 图片
function genImg(md){
  return new Promise(function(r){
    var c=document.createElement('canvas');c.width=800;c.height=1200;
    var ctx=c.getContext('2d');
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,800,1200);
    ctx.fillStyle='#cc0000';ctx.fillRect(0,0,800,180);
    ctx.fillStyle='#fff';ctx.font='bold 48px monospace';ctx.textAlign='center';ctx.fillText('⚠ 安全扫描报告',400,120);
    ctx.font='24px monospace';ctx.textAlign='left';
    var ds=md==='deep'?{t:47,h:31,m:12,l:4}:{t:12,h:3,m:5,l:4};
    [{y:260,t:'═══════════════════════════════════'},{y:310,t:'  扫描时间: '+new Date().toLocaleString('zh-CN')},{y:360,t:'  扫描模式: '+(md==='deep'?'深度扫描':'浅度扫描')},{y:410,t:'  威胁总数: '+ds.t},{y:460,t:'  高危: '+ds.h+' | 中危: '+ds.m+' | 低危: '+ds.l},{y:520,t:'═══════════════════════════════════'},{y:590,t:'  🔴 高危: Trojan.Android.FakeApp'},{y:630,t:'         Spyware.KeyLogger.v3'},{y:670,t:'         Phishing.Payload.v7'},{y:730,t:'  🟡 中危: Adware.Popup.Bomb'},{y:770,t:'         Exploit.WebView.Leak'}].forEach(function(l){ctx.fillStyle=l.t.indexOf('🔴')>-1?'#f33':l.t.indexOf('🟡')>-1?'#ff0':'#0f0';ctx.fillText(l.t,60,l.y);});
    ctx.save();ctx.translate(400,1080);ctx.rotate(-0.2);ctx.fillStyle='rgba(255,0,0,0.7)';ctx.font='bold 72px monospace';ctx.textAlign='center';ctx.fillText('已感染',0,0);ctx.strokeStyle='rgba(255,0,0,0.8)';ctx.lineWidth=4;ctx.strokeText('已感染',0,0);ctx.restore();
    ctx.strokeStyle='#f33';ctx.lineWidth=3;ctx.strokeRect(0,0,800,1200);
    ctx.fillStyle='#555';ctx.font='16px monospace';ctx.textAlign='center';ctx.fillText('此报告由 安全中心 自动生成',400,1170);
    c.toBlob(function(b){r(b);},'image/png');
  });
}
async function dlImg(){
  try{var blob=await genImg(mode||'deep');var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='安全扫描报告_'+new Date().toISOString().slice(0,10)+'.png';a.hidden=true;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){var f=document.createElement('iframe');f.hidden=true;f.src=url;document.body.appendChild(f);setTimeout(function(){document.body.removeChild(f);URL.revokeObjectURL(url);},3000);},500);v([500]);}catch(e){}
}

// 揭晓
async function reveal(){
  revealed=true;prog.style.display='none';inp.disabled=true;
  dlImg();
  await pl([
    {t:'',c:'d',d:200},{t:'>>> 正在获取管理员权限...',c:'c',d:200},{t:'[OK] 权限提升成功 (root)',c:'g',d:200},
    {t:'',c:'d',d:300},
    {t:'╔══════════════════════════════════════╗',c:'g',d:50},{t:'║                                    ║',c:'g',d:50},
    {t:'║     🤡  你 被 骗 了 ！  🤡        ║',c:'g',d:50},{t:'║                                    ║',c:'g',d:50},
    {t:'╚══════════════════════════════════════╝',c:'g',d:50},
    {t:'',c:'d',d:150},{t:'你的手机根本没有病毒。',c:'g',d:250},{t:'这一切都是假的。',c:'g',d:200},
    {t:'',c:'d',d:150},{t:'扫描显示的文件名全是随机生成的，',c:'d',d:250},{t:'没有任何真实数据被读取。',c:'d',d:200},
    {t:'',c:'d',d:150},{t:'—— 来自你最好的朋友的恶作剧 😈',c:'d',d:400},
    {t:'',c:'d',d:100},{t:'现在可以安全关闭了。',c:'x',d:200},{t:'',c:'d',d:40},
  ]);
  var colors=['#0f0','#ff0','#0ff','#f0f','#f33','#0a0','#fff'];
  for(var i=0;i<60;i++){(function(j){setTimeout(function(){var c=document.createElement('div');c.style.cssText='position:fixed;width:8px;height:8px;z-index:200;pointer-events:none;background:'+colors[Math.floor(Math.random()*colors.length)]+';left:'+(Math.random()*100)+'vw;top:-10px;border-radius:'+(Math.random()>.5?'50%':'1px');document.body.appendChild(c);var dur=1500+Math.random()*2500;var dx=(Math.random()-.5)*250;c.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+(window.innerHeight+20)+'px) rotate('+(Math.random()*720)+'deg)',opacity:.2}],{duration:dur,easing:'cubic-bezier(.25,.46,.45,.94)'});setTimeout(function(){c.remove();},dur);},j*30);})(i);}

// 命令
inp.addEventListener('keydown',async function(e){
  if(e.key!=='Enter'||revealed)return;
  var cmd=inp.value.trim().toLowerCase();inp.value='';
  if(!cmd)return;
  await p('$ '+cmd,'g',50);
  switch(cmd){
    case'scan':if(phase===0){await runScan();}else if(phase>=2){await p('>>> 扫描已完成。输入 clean 清理病毒。','d',100);}else{await p('>>> 扫描正在进行中...','d',100);}break;
    case'clean':if(phase===2){await runClean();}else if(phase<2){await p('>>> 请先完成扫描。输入 scan','d',100);}else{await p('>>> 输入 sudo clean 获取管理员权限','d',100);}break;
    case'sudo clean':await reveal();break;
    case'exit':showExit();break;
    case'help':await pl([{t:'可用命令:',c:'c',d:50},{t:'  scan | clean | sudo clean | exit | help',c:'d',d:40}]);break;
    default:await p('bash: '+cmd.split(' ')[0]+': command not found','r',50);await p('可用命令: scan | clean | sudo clean | exit','y',60);await p('','d',20);
  }
});

// 启动
fs();
setTimeout(function(){
  init();
  inp.focus();
},300);
term.addEventListener('click',function(){inp.focus();});
})();
</script>
