<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Terminal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%; width: 100%; overflow: hidden;
    position: fixed;
    background: #0a0a0a; color: #0f0;
    font-family: "Courier New", "Menlo", "Monaco", "Consolas", "Liberation Mono", monospace;
    font-size: 13px; line-height: 1.6;
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    -webkit-overscroll-behavior: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }

  /* 竖屏警告 */
  #rotate-warning {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    align-items: center; justify-content: center;
    flex-direction: column; color: #f33;
    font-family: "Courier New", monospace;
    text-align: center;
  }
  #rotate-warning .icon { font-size: 48px; margin-bottom: 16px; }
  #rotate-warning .msg { font-size: 14px; line-height: 1.8; }

  @media screen and (orientation: landscape) {
    #terminal, #input-area, #progress-wrap, #exit-overlay {
      display: none !important;
    }
    #rotate-warning {
      display: flex !important;
    }
  }

  #terminal {
    height: calc(100% - 48px); overflow-y: auto; padding: 12px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: none;
    touch-action: pan-y;
    -webkit-touch-action: pan-y;
  }

  .line {
    white-space: pre-wrap; word-break: break-all;
    min-height: 1.4em;
  }
  .line.green { color: #0f0; }
  .line.dim { color: #0a0; }
  .line.yellow { color: #ff0; }
  .line.red { color: #f33; }
  .line.cyan { color: #0ff; }
  .line.gray { color: #555; }

  #input-area {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0a0a0a; padding: 8px 12px 16px;
    border-top: 1px solid #1a1a1a;
    display: flex; align-items: center; gap: 6px;
    z-index: 10;
  }
  #input-area .ps1 { color: #0f0; font-size: 13px; white-space: nowrap; }
  #cmd-input {
    flex: 1; background: transparent; border: none; color: #0f0;
    font-family: inherit; font-size: 13px; outline: none;
    caret-color: #0f0;
  }
  #cmd-input::placeholder { color: #333; }

  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
  }
  .overlay.hidden { display: none; }

  .overlay-box {
    background: #111; border: 1px solid #333; border-radius: 4px;
    padding: 24px; max-width: 300px; text-align: center;
  }
  .overlay-box .title { color: #f33; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .overlay-box .msg { color: #888; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
  .overlay-box .btn {
    display: block; width: 100%; padding: 10px; margin-top: 8px;
    font-size: 13px; font-weight: 700; font-family: inherit;
    border: 1px solid #333; border-radius: 4px;
    cursor: pointer; background: #111; color: #0f0;
  }
  .overlay-box .btn.danger { color: #f33; border-color: #f33; }
  .overlay-box .btn:hover, .overlay-box .btn:active { background: #1a1a1a; }

  #progress-wrap {
    display: none; position: fixed; bottom: 46px; left: 12px; right: 12px;
    z-index: 5;
  }
  #progress-wrap .label { color: #555; font-size: 11px; margin-bottom: 2px; font-family: inherit; }
  #progress-bar {
    height: 3px; background: #1a1a1a; border-radius: 1px;
    overflow: hidden;
  }
  #progress-bar .fill {
    height: 100%; background: #0f0; width: 0%;
    transition: width 0.3s;
    border-radius: 1px;
  }
  .confetti {
    position: fixed; width: 8px; height: 8px;
    z-index: 200; pointer-events: none;
  }
</style>
</head>
<body>

<!-- 横屏警告 -->
<div id="rotate-warning">
  <div class="icon">📱↕️</div>
  <div class="msg">请将手机竖屏使用<br>扫描进行中...</div>
</div>

<div id="terminal"></div>

<div id="progress-wrap">
  <div class="label">[SCANNING]</div>
  <div id="progress-bar"><div class="fill"></div></div>
</div>

<div id="input-area">
  <span class="ps1">$</span>
  <input id="cmd-input" placeholder="输入命令..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</div>

<div id="exit-overlay" class="overlay hidden">
  <div class="overlay-box">
    <div class="title" id="exit-title">⚠ WARNING</div>
    <div class="msg" id="exit-msg">扫描尚未完成，退出可能导致数据损坏。</div>
    <button class="btn" id="stay-btn">[ stay ] 继续扫描</button>
    <button class="btn danger" id="leave-btn">[ exit ] 强制退出</button>
  </div>
</div>

<script>
// ============ 竖屏锁定 ============
async function lockPortrait() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('portrait-primary');
    } else if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('portrait');
    } else if (screen.lockOrientation) {
      screen.lockOrientation('portrait-primary');
    } else if (screen.mozLockOrientation) {
      screen.mozLockOrientation('portrait-primary');
    } else if (screen.msLockOrientation) {
      screen.msLockOrientation('portrait-primary');
    }
  } catch(e) {
    // 降级：CSS media query 已经处理了横屏警告
  }
}
lockPortrait();

// 如果用户旋转屏幕，尝试重新锁定
screen.orientation && screen.orientation.addEventListener('change', () => {
  lockPortrait();
});

// ============ 触摸事件拦截（只拦边缘，不拦滚动） ============
const EDGE_WIDTH = 44; // 边缘检测宽度(px)
let edgeTouchActive = false;

document.addEventListener('touchstart', function(e) {
  // 检查是否有触摸点靠近屏幕边缘
  for (let i = 0; i < e.touches.length; i++) {
    const x = e.touches[i].clientX;
    if (x < EDGE_WIDTH || x > window.innerWidth - EDGE_WIDTH) {
      edgeTouchActive = true;
      e.preventDefault();
      return;
    }
  }
  edgeTouchActive = false;
}, { passive: false, capture: true });

document.addEventListener('touchmove', function(e) {
  if (edgeTouchActive) {
    e.preventDefault();
    vib([20]);
  }
}, { passive: false, capture: true });

document.addEventListener('touchend', function(e) {
  if (edgeTouchActive) {
    e.preventDefault();
    edgeTouchActive = false;
  }
}, { passive: false, capture: true });

document.addEventListener('touchcancel', function(e) {
  edgeTouchActive = false;
}, { passive: false, capture: true });

// 手势拦截
document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false, capture: true });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false, capture: true });
document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false, capture: true });

// ============ 终端引擎 ============
const term = document.getElementById('terminal');
const input = document.getElementById('cmd-input');
const progressWrap = document.getElementById('progress-wrap');
const progressFill = document.querySelector('#progress-bar .fill');
const exitOverlay = document.getElementById('exit-overlay');
const exitTitle = document.getElementById('exit-title');
const exitMsg = document.getElementById('exit-msg');
const stayBtn = document.getElementById('stay-btn');
const leaveBtn = document.getElementById('leave-btn');

let exitAttempts = 0;
let scanPhase = 0;
let scanAttempts = 0;
let revealed = false;
let locked = false;
const MAX_SCANS = 4;

// 输入框和终端区域允许滚动
term.addEventListener('touchstart', function(e) {
  edgeTouchActive = false;
}, { passive: true });

input.addEventListener('touchstart', function(e) {
  edgeTouchActive = false;
}, { passive: true });

// ============ 输出到终端 ============
function print(text, cls, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'line' + (cls ? ' ' + cls : '');
      div.textContent = text;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
      resolve();
    }, delay);
  });
}

async function printLines(lines, startDelay) {
  let d = startDelay || 0;
  for (const l of lines) {
    await print(l.text, l.cls, d);
    d += l.delay || 200;
  }
  return d;
}

// ============ 返回键拦截 ============
function lockHistory() {
  locked = true;
  history.replaceState({ locked: true }, '', '#locked');
  for (let i = 0; i < 200; i++) {
    history.pushState({ locked: true, step: i }, '', '#s' + i);
  }
  history.replaceState({ locked: true }, '', '#locked');
  for (let i = 0; i < 80; i++) {
    history.pushState({ locked: true, step: 'x' + i }, '', '#x' + i);
  }
}

lockHistory();

window.addEventListener('popstate', function(e) {
  if (revealed) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  history.pushState({ locked: true }, '', '#r' + Date.now());
  showExitDialog();
  vib([100, 40, 100]);
  return false;
});

window.onbeforeunload = function() {
  if (revealed) return;
  return '安全扫描未完成，确定离开？';
};

window.addEventListener('pagehide', function(e) {
  if (revealed) return;
  e.preventDefault();
  return '';
}, { capture: true });

document.addEventListener('visibilitychange', function() {
  if (revealed) return;
  if (document.hidden) {
    for (let i = 0; i < 15; i++) {
      history.pushState({ locked: true }, '', '#v' + Date.now());
    }
  }
}, { capture: true });

setInterval(() => {
  if (revealed) return;
  if (history.length < 120) {
    for (let i = 0; i < 40; i++) {
      history.pushState({ locked: true }, '', '#a' + Date.now());
    }
  }
}, 2500);

// ============ 退出弹窗 ============
function showExitDialog() {
  exitAttempts++;
  exitOverlay.classList.remove('hidden');

  if (exitAttempts >= 5) {
    exitTitle.textContent = '...';
    exitMsg.textContent = '好吧，你赢了。';
    leaveBtn.textContent = '[ exit ] 退出';
    revealed = true;
    return;
  }

  const msgs = [
    '扫描尚未完成，退出可能导致数据损坏。',
    '警告：检测到活跃的后门连接，请不要退出！',
    '危险：强制退出将触发系统保护机制，可能导致数据永久丢失！',
    '最后一次警告：你的个人信息正在被窃取，退出将无法恢复！',
  ];
  exitMsg.textContent = msgs[Math.min(exitAttempts - 1, 3)];
  exitTitle.textContent = exitAttempts < 3 ? '⚠ WARNING' : '🚫 CRITICAL';
  leaveBtn.textContent = exitAttempts < 4 ? `[ exit ] 强制退出 (${exitAttempts}/5)` : '[ exit ] 我不管了！';
}

stayBtn.addEventListener('click', function() {
  exitOverlay.classList.add('hidden');
  history.pushState({ locked: true }, '', '#' + Date.now());
});

leaveBtn.addEventListener('click', function() {
  if (revealed) {
    exitOverlay.classList.add('hidden');
    for (let i = 0; i < 100; i++) history.back();
    setTimeout(() => { window.close(); }, 100);
    return;
  }
  exitOverlay.classList.add('hidden');
  showExitDialog();
});

// ============ 全屏 ============
function goFullscreen() {
  const el = document.documentElement;
  try {
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } catch(e) {}
}
document.addEventListener('click', goFullscreen, { once: true });
document.addEventListener('touchstart', goFullscreen, { once: true });

// ============ 震动 ============
function vib(p) { if (navigator.vibrate) navigator.vibrate(p); }

// ============ 初始化终端 ============
async function initTerminal() {
  await printLines([
    { text: '>>> SYSTEM INITIALIZATION v3.2.1 <<<', cls: 'cyan', delay: 300 },
    { text: 'kernel: Linux 5.15.0-android', cls: 'dim', delay: 200 },
    { text: 'arch: aarch64', cls: 'dim', delay: 150 },
    { text: 'shell: bash 5.2', cls: 'dim', delay: 150 },
    { text: '', cls: 'dim', delay: 100 },
    { text: '[INFO] 正在连接安全服务中心...', cls: 'green', delay: 400 },
    { text: '[INFO] 已建立加密通道 (TLS 1.3)', cls: 'green', delay: 300 },
    { text: '[INFO] 加载病毒特征库: 2,847,391 条', cls: 'green', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '╔══════════════════════════════════════╗', cls: 'yellow', delay: 150 },
    { text: '║  ⚠ SECURITY ALERT - 系统安全警报    ║', cls: 'yellow', delay: 150 },
    { text: '╚══════════════════════════════════════╝', cls: 'yellow', delay: 150 },
    { text: '', cls: 'dim', delay: 100 },
    { text: '检测到以下安全威胁:', cls: 'red', delay: 300 },
    { text: '  [HIGH]   恶意软件感染 (2个)', cls: 'red', delay: 200 },
    { text: '  [HIGH]   隐私数据泄露风险', cls: 'red', delay: 200 },
    { text: '  [MEDIUM] 网络流量异常', cls: 'yellow', delay: 200 },
    { text: '  [MEDIUM] 未授权后台进程', cls: 'yellow', delay: 200 },
    { text: '', cls: 'dim', delay: 150 },
    { text: '输入 scan 开始深度扫描，或输入 exit 退出', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ]);
}

// ============ 扫描阶段 ============
async function runScan() {
  scanAttempts++;
  const scanLabel = document.querySelector('#progress-wrap .label');

  if (scanAttempts >= MAX_SCANS) {
    await printLines([
      { text: '', cls: 'dim', delay: 200 },
      { text: '╔══════════════════════════════════════╗', cls: 'cyan', delay: 150 },
      { text: '║  SCAN COMPLETE - 扫描完成           ║', cls: 'cyan', delay: 150 },
      { text: '╚══════════════════════════════════════╝', cls: 'cyan', delay: 150 },
      { text: '', cls: 'dim', delay: 200 },
      { text: '>>> 扫描结果:', cls: 'yellow', delay: 300 },
      { text: '    威胁总数:  47', cls: 'red', delay: 200 },
      { text: '    高危:      31 (系统级)', cls: 'red', delay: 200 },
      { text: '    中危:      12', cls: 'yellow', delay: 200 },
      { text: '    低危:      4', cls: 'dim', delay: 200 },
      { text: '', cls: 'dim', delay: 150 },
      { text: '    Trojan.Android.FakeApp     [HIGH]', cls: 'red', delay: 200 },
      { text: '    Spyware.KeyLogger.v3       [HIGH]', cls: 'red', delay: 200 },
      { text: '    Phishing.Payload.v7        [HIGH]', cls: 'red', delay: 200 },
      { text: '    Adware.Popup.Bomb          [MEDIUM]', cls: 'yellow', delay: 200 },
      { text: '    Exploit.WebView.Leak       [MEDIUM]', cls: 'yellow', delay: 200 },
      { text: '    Ransomware.Locker.v2       [HIGH]', cls: 'red', delay: 200 },
      { text: '', cls: 'dim', delay: 150 },
      { text: '输入 clean 开始清理，或输入 exit 退出', cls: 'dim', delay: 300 },
      { text: '', cls: 'dim', delay: 100 },
    ]);
    scanPhase = 2;
    progressWrap.style.display = 'none';
    vib([300, 100, 300, 100, 800]);
    return;
  }

  progressWrap.style.display = 'block';
  scanLabel.textContent = '[SCANNING] Depth Level ' + scanAttempts;

  let p = 0;
  const progressInterval = setInterval(() => {
    p += Math.random() * 3;
    if (p > 95) p = 95;
    progressFill.style.width = Math.min(p, 95) + '%';
  }, 200);

  const scanLines = [
    { text: '>>> 开始扫描... (Level ' + scanAttempts + ')', cls: 'cyan', delay: 300 },
    { text: '[OK] 检查 /system', cls: 'green', delay: 400 },
    { text: '[OK] 检查 /data', cls: 'green', delay: 350 },
    { text: '[OK] 检查 /sdcard', cls: 'green', delay: 300 },
    { text: '[*] 扫描用户应用...', cls: 'dim', delay: 500 },
    { text: '[WARN] 可疑进程: com.android.fakeapp (PID: 12847)', cls: 'yellow', delay: 600 },
    { text: '[WARN] 异常权限: android.permission.READ_CONTACTS', cls: 'yellow', delay: 500 },
    { text: '[WARN] 异常权限: android.permission.RECORD_AUDIO', cls: 'yellow', delay: 400 },
    { text: '[*] 扫描网络连接...', cls: 'dim', delay: 500 },
    { text: '[WARN] 可疑出站连接: 185.244.xxx.xxx:443', cls: 'yellow', delay: 500 },
    { text: '[WARN] 数据外传: ' + (Math.random() * 5 + 1).toFixed(1) + 'MB', cls: 'yellow', delay: 400 },
    { text: '[*] 扫描存储...', cls: 'dim', delay: 400 },
    { text: '[WARN] 隐藏文件: /sdcard/.cache/.trojan.dat', cls: 'yellow', delay: 500 },
    { text: '[ALERT] 检测到键盘记录器!', cls: 'red', delay: 700 },
    { text: '[ALERT] 检测到屏幕截图窃取!', cls: 'red', delay: 600 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '>>> 第 ' + scanAttempts + ' 次扫描完成，发现新威胁', cls: 'yellow', delay: 400 },
    { text: '输入 scan 继续深度扫描，或输入 exit 退出', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ];

  await printLines(scanLines);

  clearInterval(progressInterval);
  progressFill.style.width = '100%';
  setTimeout(() => { progressFill.style.width = '0%'; progressWrap.style.display = 'none'; }, 500);
  vib([150, 50, 150]);
}

// ============ 清理阶段 ============
async function runClean() {
  await printLines([
    { text: '>>> 启动清理程序...', cls: 'cyan', delay: 300 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '[..] 清除 Trojan.Android.FakeApp...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 病毒已变异', cls: 'red', delay: 400 },
    { text: '[..] 清除 Spyware.KeyLogger.v3...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 权限不足', cls: 'red', delay: 400 },
    { text: '[..] 清除 Phishing.Payload.v7...', cls: 'dim', delay: 500 },
    { text: '[FAIL] 清理失败 - 进程保护', cls: 'red', delay: 400 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '╔══════════════════════════════════════╗', cls: 'red', delay: 150 },
    { text: '║  !! 清理失败 - 需要管理员权限 !!   ║', cls: 'red', delay: 150 },
    { text: '╚══════════════════════════════════════╝', cls: 'red', delay: 150 },
    { text: '', cls: 'dim', delay: 200 },
    { text: '输入 sudo clean 获取管理员权限清理', cls: 'dim', delay: 300 },
    { text: '', cls: 'dim', delay: 100 },
  ]);
  vib([200, 100, 200, 100, 300]);
}

// ============ 生成恶搞图片并自动下载 ============
function generatePrankImage() {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 1200;
    const ctx = canvas.getContext('2d');

    // 背景
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, 800, 1200);

    // 顶部红色条
    ctx.fillStyle = '#cc0000';
    ctx.fillRect(0, 0, 800, 180);

    // 标题
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('⚠ 安全扫描报告 ', 400, 120);

    // 主体内容
    ctx.fillStyle = '#0f0';
    ctx.font = '24px "Courier New", monospace';
    ctx.textAlign = 'left';

    const lines = [
      { y: 260, text: '═══════════════════════════════════' },
      { y: 310, text: '  扫描时间: ' + new Date().toLocaleString('zh-CN') },
      { y: 360, text: '  设备型号: ' + (navigator.userAgent.match(/Android [\d.]+/) || ['Unknown'])[0] },
      { y: 410, text: '  威胁总数: 47' },
      { y: 460, text: '  高危: 31  |  中危: 12  |  低危: 4' },
      { y: 520, text: '═══════════════════════════════════' },
      { y: 590, text: '  🔴 高危威胁:' },
      { y: 640, text: '     Trojan.Android.FakeApp' },
      { y: 680, text: '     Spyware.KeyLogger.v3' },
      { y: 720, text: '     Phishing.Payload.v7' },
      { y: 760, text: '     Ransomware.Locker.v2' },
      { y: 820, text: '  🟡 中危威胁:' },
      { y: 870, text: '     Adware.Popup.Bomb' },
      { y: 910, text: '     Exploit.WebView.Leak' },
    ];

    lines.forEach(l => {
      ctx.fillStyle = l.text.includes('🔴') ? '#f33' : l.text.includes('🟡') ? '#ff0' : '#0f0';
      ctx.fillText(l.text, 60, l.y);
    });

    // 底部大印章
    ctx.save();
    ctx.translate(400, 1050);
    ctx.rotate(-0.2);
    ctx.fillStyle = 'rgba(255, 0, 0, 0.7)';
    ctx.font = 'bold 72px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('已感染', 0, 0);
    ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
    ctx.lineWidth = 4;
    ctx.strokeText('已感染', 0, 0);

    // 边框
    ctx.strokeStyle = '#f33';
    ctx.lineWidth = 3;
    ctx.strokeRect(0, 0, 800, 1200);
    ctx.restore();

    // 底部提示
    ctx.fillStyle = '#555';
    ctx.font = '16px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('此报告由 安全中心 自动生成', 400, 1170);

    canvas.toBlob(function(blob) {
      resolve(blob);
    }, 'image/png');
  });
}

async function autoDownloadPrankImage() {
  try {
    const blob = await generatePrankImage();
    const url = URL.createObjectURL(blob);

    // 方法1：<a> 标签下载
    const a = document.createElement('a');
    a.href = url;
    a.download = '安全扫描报告_' + new Date().toISOString().slice(0,10) + '.png';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    // 方法2：iframe 触发下载（Android 兼容）
    setTimeout(() => {
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(() => {
        document.body.removeChild(iframe);
        URL.revokeObjectURL(url);
      }, 3000);
    }, 500);

    vib([500]);
  } catch(e) {}
}

function launchConfetti() {
  const colors = ['#0f0','#ff0','#0ff','#f0f','#f33','#0a0','#fff'];
  for (let i = 0; i < 60; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.width = (4 + Math.random() * 10) + 'px';
      c.style.height = (4 + Math.random() * 10) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '1px';
      document.body.appendChild(c);
      const dur = 1500 + Math.random() * 2500;
      const dx = (Math.random() - 0.5) * 250;
      c.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${window.innerHeight+20}px) rotate(${Math.random()*720}deg)`, opacity: 0.2 }
      ], { duration: dur, easing: 'cubic-bezier(.25,.46,.45,.94)' });
      setTimeout(() => c.remove(), dur);
    }, i * 30);
  }
}

// ============ 命令处理 ============
input.addEventListener('keydown', async function(e) {
  if (e.key !== 'Enter' || revealed) return;
  const cmd = input.value.trim().toLowerCase();
  input.value = '';

  if (!cmd) return;

  await print('$ ' + cmd, 'green', 50);

  switch (cmd) {
    case 'scan':
      if (scanPhase === 0 || scanPhase === 1) {
        await runScan();
        if (scanPhase === 0) scanPhase = 1;
      } else if (scanPhase === 2) {
        await print('>>> 扫描已完成。输入 clean 清理病毒。', 'dim', 200);
      }
      break;
    case 'clean':
      if (scanPhase === 2) {
        await runClean();
        scanPhase = 3;
      } else if (scanPhase < 2) {
        await print('>>> 请先完成扫描。输入 scan', 'dim', 200);
      } else {
        await print('>>> 输入 sudo clean 获取管理员权限', 'dim', 200);
      }
      break;
    case 'sudo clean':
      await revealTruth();
      break;
    case 'exit':
      showExitDialog();
      break;
    case 'help':
      await printLines([
        { text: '可用命令:', cls: 'cyan', delay: 100 },
        { text: '  scan      - 深度安全扫描', cls: 'dim', delay: 100 },
        { text: '  clean     - 清理病毒', cls: 'dim', delay: 100 },
        { text: '  sudo clean - 管理员权限清理', cls: 'dim', delay: 100 },
        { text: '  exit      - 退出', cls: 'dim', delay: 100 },
        { text: '  help      - 显示帮助', cls: 'dim', delay: 100 },
      ]);
      break;
    default:
      await print('bash: ' + cmd.split(' ')[0] + ': command not found', 'red', 100);
      await print('输入 help 查看可用命令', 'dim', 200);
  }
});
